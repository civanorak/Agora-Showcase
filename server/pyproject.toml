[project]
name = "agora-server"
version = "0.1.0"
description = "AGORA — AI traffic analytics for merchants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # pytest-asyncio's own use of the deprecated event-loop-policy API — not our
    # code; removed when we upgrade the plugin. Silenced to keep output signal-rich.
    "ignore:'asyncio.[gs]et_event_loop_policy' is deprecated:DeprecationWarning",
]
